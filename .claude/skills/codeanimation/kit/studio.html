<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Animation Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; justify-items: center; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; width: min(100%, 1280px); }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script>
  if (typeof PROJECT !== 'undefined') {
    const c = document.getElementById('out');
    const w = PROJECT.width || 1920, h = PROJECT.height || 1080;
    c.width = w; c.height = h;
    c.style.aspectRatio = w + ' / ' + h;
    if (w < h) { c.style.maxWidth = '480px'; document.querySelector('.bar').style.maxWidth = '480px'; }
    document.getElementById('scrub').max = PROJECT.duration || 11;
  }
</script>
<script src="src/core.js"></script>
<script src="src/timeline.js"></script>
<script src="src/characters/actor.js"></script>
<script src="src/sheets.js"></script>
<!-- video scenes: add script tags here -->
<script src="src/scenes/main.js"></script>
<script>
  // Open studio.html?loop=emotions to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && typeof LOOPS !== 'undefined' && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
